<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yaar Chat</title>
<style>
:root{--bar:#0f6b5c;--bg:#ece5dd;--in:#fff;--out:#d9fdd3;--ink:#111b21;--mute:#667781;--line:#e1dcd5;--send:#128c63;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bar:#1f2c34;--bg:#0b141a;--in:#202c33;--out:#005c4b;--ink:#e9edef;--mute:#8696a0;--line:#26343c;--send:#00a884}}
:root[data-theme="dark"]{--bar:#1f2c34;--bg:#0b141a;--in:#202c33;--out:#005c4b;--ink:#e9edef;--mute:#8696a0;--line:#26343c;--send:#00a884}
html{height:100%;background:linear-gradient(var(--bar) 50%,var(--bg) 50%)}
html,body{margin:0}
body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
.view{height:100%;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bar);color:#fff}
header h1{flex:1;margin:0;font-size:1.15rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{background:none;border:0;color:#fff;font:inherit;font-size:1rem;min-height:44px;min-width:44px;padding:0 8px}
#login{align-items:center;justify-content:center;text-align:center;padding:24px;gap:14px;background:var(--in)}
#login h1{margin:0;font-size:1.9rem}
#hint{margin:0;color:var(--mute)}
.go{border:0;border-radius:99px;background:var(--send);color:#fff;font:inherit;font-weight:700;padding:13px 26px;min-height:48px}
#chats,#msgs{flex:1;min-height:0;overflow-y:auto}
#chats{background:var(--in)}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;font:inherit;color:var(--ink)}
.row div:last-child{min-width:0;flex:1}
.row b,.row span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row span{color:var(--mute);font-size:.9rem}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border:0;border-radius:50%;background:var(--send);color:#fff;font-size:1.9rem;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.empty{color:var(--mute);text-align:center;padding:32px 20px}
#msgs{padding:12px 10px;display:flex;flex-direction:column;gap:4px}
.m{max-width:80%;padding:6px 9px 4px;border-radius:9px;background:var(--in);box-shadow:0 1px 1px rgba(0,0,0,.14);align-self:flex-start;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--out)}
.m p{margin:0;white-space:pre-wrap}
.m time{display:block;text-align:right;font-size:.7rem;color:var(--mute)}
.bar{flex:none;display:flex;align-items:flex-end;gap:8px;padding:8px;background:var(--bg)}
.bar textarea{flex:1;min-width:0;resize:none;max-height:120px;border:0;border-radius:23px;padding:12px 16px;font:inherit;background:var(--in);color:var(--ink)}
.bar button{flex:none;width:46px;height:46px;border:0;border-radius:50%;background:var(--send);color:#fff;display:grid;place-items:center}
:is(button,textarea):focus-visible{outline:3px solid #7fb8ff;outline-offset:2px}
</style>
</head>
<body>
<section class="view" id="login">
<h1>Yaar Chat</h1>
<p id="hint">Dosto ke sath chat karo, bilkul WhatsApp jaisa.</p>
<button class="go" id="gl">Google se login karo</button>
</section>
<section class="view" id="list" hidden>
<header><h1>Yaar Chat</h1><button class="hb" id="out">Logout</button></header>
<div id="chats"></div>
<button class="fab" id="new" aria-label="Naya chat">+</button>
</section>
<section class="view" id="chat" hidden>
<header><button class="hb" id="back" aria-label="Wapas">←</button><h1 id="cn"></h1></header>
<div id="msgs" aria-live="polite"></div>
<div class="bar">
<textarea id="in" rows="1" maxlength="1000" placeholder="Message likho" aria-label="Message"></textarea>
<button id="send" aria-label="Bhejo"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg></button>
</div>
</section>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,getDocs,collection,query,where,orderBy,limit,onSnapshot}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Paste your Firebase web app config here (Project settings > Your apps)
const firebaseConfig={apiKey:"AIzaSyDuQFRJ0VEfq2hsrqCUDGIoLPB2m0_CX9s",authDomain:"yaarchat-1ae57.firebaseapp.com",projectId:"yaarchat-1ae57",storageBucket:"yaarchat-1ae57.firebasestorage.app",messagingSenderId:"917074547217",appId:"1:917074547217:web:817530f750883b846757b0"};

const $=s=>document.querySelector(s);
const show=v=>{for(const x of document.querySelectorAll('.view'))x.hidden=x.id!==v};
const hue=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))%360;return x};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const av=n=>{const d=el('div','av',(n||'?')[0].toUpperCase());d.style.background='hsl('+hue(n||'')+' 45% 42%)';return d};
const hm=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
let auth,db,me,cur,unsubChats,unsubMsgs;

function openChat(id,name){
 cur=id;$('#cn').textContent=name;$('#msgs').replaceChildren();show('chat');
 unsubMsgs&&unsubMsgs();
 unsubMsgs=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('ts','desc'),limit(200)),s=>{
  const box=$('#msgs'),stick=!box.children.length||box.scrollHeight-box.scrollTop-box.clientHeight<90;
  box.replaceChildren();
  for(const x of s.docs.map(d=>d.data()).reverse()){
   const d=el('div','m'+(x.from===me.uid?' me':''));
   d.append(el('p','',x.text),el('time','',hm(x.ts)));box.append(d);
  }
  if(stick)box.scrollTop=box.scrollHeight;
 });
}
async function send(){
 const ta=$('#in'),text=ta.value.trim();
 if(!text||!cur)return;
 ta.value='';ta.style.height='auto';
 try{
  await addDoc(collection(db,'chats',cur,'messages'),{from:me.uid,text,ts:Date.now()});
  await updateDoc(doc(db,'chats',cur),{last:text.slice(0,60),updatedAt:Date.now()});
 }catch{ta.value=text}
}
async function newChat(){
 const e=(prompt('Dost ka Gmail likho (unhe pehle app me login karna hoga)')||'').trim().toLowerCase();
 if(!e)return;
 if(e===me.email){alert('Ye to tumhara apna email hai 😄');return}
 try{
  const s=await getDocs(query(collection(db,'users'),where('email','==',e)));
  if(s.empty){alert('Ye dost abhi app me nahi aaya. Unhe link bhejo, login karne ke baad dobara try karo.');return}
  const f=s.docs[0],id=[me.uid,f.id].sort().join('_'),ref=doc(db,'chats',id);
  if(!(await getDoc(ref)).exists())await setDoc(ref,{members:[me.uid,f.id],names:{[me.uid]:me.name,[f.id]:f.data().name},last:'',updatedAt:Date.now()});
  openChat(id,f.data().name);
 }catch{alert('Kuch gadbad hui. Firestore rules check karo.')}
}
function watchChats(){
 unsubChats=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),s=>{
  const L=$('#chats');L.replaceChildren();
  const rows=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.updatedAt-a.updatedAt);
  if(!rows.length)L.append(el('p','empty','Abhi koi chat nahi. Neeche + dabao aur dost ka email daalo.'));
  for(const c of rows){
   const n=(c.names||{})[c.members.find(x=>x!==me.uid)]||'Dost';
   const b=el('button','row');
   const t=el('div');t.append(el('b','',n),el('span','',c.last||'Naya chat'));
   b.append(av(n),t);b.onclick=()=>openChat(c.id,n);L.append(b);
  }
 });
}

if(firebaseConfig.apiKey.startsWith('PASTE')){
 $('#hint').textContent='Setup baki hai: index.html me Firebase config paste karo.';$('#gl').hidden=true;
}else{
 const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);
 $('#gl').onclick=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>{$('#hint').textContent='Login nahi hua. Dobara try karo.'});
 onAuthStateChanged(auth,async u=>{
  unsubChats&&unsubChats();unsubMsgs&&unsubMsgs();cur=null;
  if(!u){me=null;show('login');return}
  me={uid:u.uid,name:u.displayName||u.email,email:(u.email||'').toLowerCase()};
  try{await setDoc(doc(db,'users',u.uid),{name:me.name,email:me.email},{merge:true})}catch{}
  show('list');watchChats();
 });
}
$('#out').onclick=()=>signOut(auth);
$('#new').onclick=newChat;
$('#back').onclick=()=>{unsubMsgs&&unsubMsgs();cur=null;show('list')};
$('#send').onclick=send;
$('#in').addEventListener('input',e=>{const t=e.target;t.style.height='auto';t.style.height=Math.min(t.scrollHeight,120)+'px'});
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();send()}});
</script>
</body>
</html>
